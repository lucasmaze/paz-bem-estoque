
# Pipeline de integração contínua do MVP.
name: Testes automatizados

# Executa os testes quando houver alterações na main
# ou quando um Pull Request for aberto ou atualizado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Executar testes
    runs-on: ubuntu-latest

    steps:
      # Obtém os arquivos do repositório.
      - name: Baixar código
        uses: actions/checkout@v4

      # Configura o ambiente Python.
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Instala as dependências.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # Executa os testes e calcula a cobertura.
      - name: Executar testes automatizados
        run: |
          python -m pytest tests/ --cov=app --cov-report=term-missing
