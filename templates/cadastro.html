
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configura a acentuação e a exibição no celular. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Carrega o CSS utilizado nas outras páginas. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>Cadastro de Medicamentos</title>
</head>

<body>

    <!-- Identifica o sistema e a finalidade da página. -->
    <h1>PAZ & BEM MEDICAMENTOS</h1>
    <h2>Cadastro de medicamentos</h2>

    <!-- Formulário que envia os dados ao Flask. -->
    <form method="POST" class="formulario-cadastro">

        <!-- Nome do medicamento. -->
        <label for="nome">Nome do medicamento:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            maxlength="150"
            required
        >

        <!-- Quantidade disponível no estoque. -->
        <label for="quantidade">Quantidade:</label>
        <input
            type="number"
            id="quantidade"
            name="quantidade"
            min="0"
            step="1"
            required
        >

        <!-- Data de validade do medicamento. -->
        <label for="validade">Data de validade:</label>
        <input
            type="date"
            id="validade"
            name="validade"
            required
        >

        <!-- Botão para enviar o cadastro. -->
        <button type="submit">Cadastrar medicamento</button>

    </form>

    <!-- Permite retornar à consulta de estoque. -->
    <p>
        <a href="/estoque">Voltar ao estoque</a>
    </p>

</body>
</html>
