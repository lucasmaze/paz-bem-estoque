<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Medicamentos</title>
</head>
<body>
    <!-- Identifica o sistema e a finalidade da página. -->
    <h1>PAZ & BEM MEDICAMENTOS</h1>
    <h2>Cadastro de medicamentos</h2>

    <!-- Formulário que enviará os dados ao Flask. -->
    <form method="POST">

        <!-- Nome do medicamento. -->
        <label for="nome">Nome do medicamento:</label>
        <input type="text" id="nome" name="nome" required maxlength="150">

        <p></p>

        <!-- Quantidade disponível no estoque. -->
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" name="quantidade"
               min="0" step="1" required>

        <p></p>

        <!-- Data de validade do medicamento. -->
        <label for="validade">Data de validade:</label>
        <input type="date" id="validade" name="validade" required>

        <p></p>

        <!-- Botão para enviar o cadastro. -->
        <button type="submit">Cadastrar medicamento</button>

    </form>
</body>
</html>
