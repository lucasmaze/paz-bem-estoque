<h2>Consulta de estoque</h2>

    <table border="1" cellpadding="8">
        <tr>
            <th>Medicamento</th>
            <th>Quantidade</th>
            <th>Validade</th>
            <th>Situação da validade</th>
            <th>Ação</th>
        </tr>

        {% for medicamento in medicamentos %}
        <tr>
            <td>{{ medicamento["nome"] }}</td>
            <td>{{ medicamento["quantidade"] }}</td>
            <td>{{ medicamento["data_validade"] }}</td>
            <td>{{ avisos[loop.index0] }}</td>
            <td>
    <a href="/atualizar/{{ medicamento['id_estoque'] }}">
        Atualizar
    </a>
</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="/cadastro">Cadastrar medicamento</a></p>
</body>
</html>
